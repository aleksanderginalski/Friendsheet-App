name: CI

# When to run this workflow
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Setup Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable' 
      
      # Step 3: Setup Flutter environment

      - name: Setup Firebase options for CI
        run: |
          if (!(Test-Path lib/firebase_options.dart)) {
            Copy-Item lib/firebase_options.example.dart lib/firebase_options.dart
            Write-Host "Created firebase_options.dart from example template for CI"
          }
        shell: pwsh

      # Step 4: Get dependencies
      - name: Install dependencies
        run: flutter pub get
      
      # Step 5: Verify formatting
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      
      # Step 6: Analyze code
      - name: Analyze code
        run: flutter analyze
      
      # Step 7: Run tests
      - name: Run tests
        run: flutter test