name: friendsheet
description: Track your meetings with friends and generate insightful statistics
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# Dependencies - packages that the app needs to run
dependencies:
  flutter:
    sdk: flutter

  # Firebase Core - required for all Firebase services
  firebase_core: ^3.6.0

  # Firebase Authentication - for user login/registration
  firebase_auth: ^5.3.1

  # SSO Signing - for user login/registration
  google_sign_in: ^6.2.1

  # Cloud Firestore - NoSQL database
  cloud_firestore: ^5.4.4

  # State Management - choose one (Provider recommended for beginners)
  provider: ^6.1.2

  freezed_annotation: ^2.4.4

  json_annotation: ^4.9.0

  # Date formatting utilities
  intl: ^0.19.0

  # Key-value persistence for user preferences (hidden persons list)
  shared_preferences: ^2.3.2

  # Device file system paths for export feature
  path_provider: ^2.1.0

  # Google Fonts for Nunito typography (US-050)
  google_fonts: ^6.2.1

  # Video playback for animated splash screen (US-052)
  video_player: ^2.9.2

  # Open URLs in external browser for ToS and Privacy Policy links (US-053)
  url_launcher: ^6.3.0

  # Encrypted key-value storage for OAuth tokens (US-066)
  flutter_secure_storage: ^9.2.2

  # UUID generation for ImportCandidate IDs (US-067)
  uuid: ^4.0.0

  # UI Icons
  cupertino_icons: ^1.0.6

# Development dependencies - only used during development
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting rules for code quality
  flutter_lints: ^4.0.0

  # Testing utilities
  mockito: ^5.4.4

  # Code generation for mocks
  build_runner: ^2.4.13

  freezed: ^2.5.7

  json_serializable: ^6.8.0

  fake_cloud_firestore: ^3.1.0

  # Firebase Core test utilities (setupFirebaseCoreMocks)
  firebase_core_platform_interface: ^6.0.2

  # App icon generation for Android
  flutter_launcher_icons: ^0.14.1

# Flutter configuration
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/activities/
    - assets/animations/
    - assets/images/

  # Add custom fonts here when needed
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: 'assets/icons/icon.png'
  adaptive_icon_background: 'assets/icons/icon.png'
  adaptive_icon_foreground: 'assets/icons/icon.png'
  min_sdk_android: 21